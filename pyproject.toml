[build-system]
requires=["setuptools"]
build-backend="setuptools.build_meta"

[project]
name="rag_tool"
requires-python=">=3.10"
dependencies=[]
readme="README.md"
authors=[
    { name = "Dumitru Melniciuc" }
]
dynamic=["version"]

[tool.setuptools]
packages=["rag_tool"]

[tool.ruff.lint]
select = ["E", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention="google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
ignore_missing_imports = true